name: Check and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install Pillow av aiohttp cryptography
      - run: python -m unittest discover -s tests -v
      - run: node --input-type=module --check < web/papan.js
      - run: node --check scripts/ui-test.mjs
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: comfyui-papan
          path: dist/comfyui-papan-*.zip*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/download-artifact@v4
        with:
          name: comfyui-papan
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "Papan for ComfyUI $TAG" --notes-file RELEASE_NOTES.md
          fi
